name: Deploy Momoirobara to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject mobile and persistence assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          css='<link rel="stylesheet" href="./mobile-support.css?v=mobile-2">'
          js='<script src="./mobile-support.js?v=mobile-2" defer></script>'
          persist='<script src="./settings-persistence.js?v=persist-1" defer></script>'
          if css not in s: s=s.replace('</head>',css+'\n</head>',1)
          if js not in s: s=s.replace('</body>',js+'\n</body>',1)
          if persist not in s: s=s.replace('</body>',persist+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          test -f mobile-support.css
          test -f mobile-support.js
          test -f settings-persistence.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
