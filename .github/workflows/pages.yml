name: Deploy Momoirobara to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject current runtime assets
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          assets=[
            '<link rel="stylesheet" href="./mobile-support.css?v=mobile-3">',
            '<script src="./mobile-support.js?v=mobile-3" defer></script>',
            '<script src="./settings-persistence.js?v=persist-2" defer></script>',
            '<script src="./remove-legacy-lastfm.js?v=lastfm-remove-1" defer></script>',
          ]
          for tag in assets:
            if tag not in s:
              if tag.startswith('<link '): s=s.replace('</head>',tag+'\n</head>',1)
              else: s=s.replace('</body>',tag+'\n</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
          test -f mobile-support.css
          test -f mobile-support.js
          test -f settings-persistence.js
          test -f remove-legacy-lastfm.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
